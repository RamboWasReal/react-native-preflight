appId: "com.preflight.example"
tags:
  - preflight
  - "profile"
---
- launchApp:
    stopApp: false

- openLink:
    link: "preflight://scenario/profile"

- assertVisible:
    id: "profile"

- assertVisible:
    id: "profile-name"
    text: "Jane Doe"

- assertVisible:
    id: "profile-email"
    text: "jane@example.com"

- waitForAnimationToEnd

- takeScreenshot: ".maestro/snapshots/profile/current"
